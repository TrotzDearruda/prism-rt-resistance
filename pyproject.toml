[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-multimodal-reprogramming"
version = "0.4.2"
description = "Constrained multimodal representation learning with spatial-metabolic alignment and cross-setting invariance for rectal chemoradiotherapy response"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Prism study group" }]
keywords = ["rectal cancer", "chemoradiotherapy", "spatial metabolomics", "domain invariance"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
  "PyYAML>=6.0,<7",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.0",
  "isort>=5.13",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
prism-train = "prism.cli.train:main"
prism-evaluate = "prism.cli.evaluate:main"
prism-emit = "prism.cli.emit:main"
prism-verify = "prism.cli.verify:main"
prism-report = "prism.cli.report:main"

[tool.setuptools]
package-dir = { "" = "code" }

[tool.setuptools.packages.find]
where = ["code"]
include = ["prism*"]
exclude = ["tests*", "checks*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "ARG", "PL"]
ignore = [
  "PLR0913",
  "PLR0912",
  "PLR0915",
  "PLR2004",
  "N803",
  "N806",
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"code/tests/*" = ["PLR2004", "ARG001", "ARG002", "S101"]
"code/checks/*" = ["PLR2004", "T201", "PLC0415", "ARG001", "ARG002", "PLR0915", "PLR0912"]

[tool.ruff.lint.isort]
known-first-party = ["prism"]

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = false
extend-exclude = '''
/(
    \.git
  | artifacts
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["prism"]
src_paths = ["code"]

[tool.mypy]
python_version = "3.11"
mypy_path = "code"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = false
plugins = []
exclude = ["^code/tests/"]

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "pandas.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["prism.modelling.streams"]
warn_return_any = false

[[tool.mypy.overrides]]
module = ["checks.*"]
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["code/prism"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
