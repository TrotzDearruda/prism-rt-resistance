# Backbone and heads.
# Ref: Methods Sec. 6.3 -- one encoder per stream, pooling inside each stream and fusion after
# pooling; Sec. 6.6 -- a decoder to the metabolite vocabulary and a head for the intervals.
# The article prints no widths or depths, so every number below is an engineering default.
streams:
  ct:
    input_shape: [1, 4, 12, 12]
    width: 64
    depth: 3
    dropout: 0.10
  mri:
    input_shape: [1, 3, 12, 12]
    width: 64
    depth: 3
    dropout: 0.10
  histology:
    input_shape: [256]
    width: 128
    depth: 2
    dropout: 0.10
  labs:
    input_shape: [24]
    width: 64
    depth: 2
    dropout: 0.05
fused_dim: 192
representation_dim: 192
probe_hidden: 128
interval_hidden: 128
decoder_hidden: 128
site_classifier_hidden: 128
